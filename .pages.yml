media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: md
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: excerpt
        label: Excerpt
        type: text
      - name: body
        label: Body
        type: rich-text
